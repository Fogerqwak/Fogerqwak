# Generates 3D contribution calendars via yoshi389111/github-profile-3d-contrib.
# README uses: ./profile-3d-contrib/profile-night-green.svg
name: Profile 3D Contrib

on:
  # Daily at 18:00 UTC (aligned with upstream sample; contribution data settles overnight).
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate 3D contribution SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Upstream emits every theme; keep only the one referenced in README.
      - name: Keep active theme only
        run: |
          find profile-3d-contrib -type f ! -name 'profile-night-green.svg' -delete
          ls -la profile-3d-contrib/

      - name: Commit and push generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "No 3D contrib changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile 3D contribution graph"
          git push
