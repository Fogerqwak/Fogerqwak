# Renders a focused lowlighter/metrics card (selected plugins only).
# README uses: ./github-metrics.svg
#
# Required secret: METRICS_TOKEN (classic PAT; see docs/SETUP.md)
name: GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github-metrics:
    name: Generate github-metrics.svg
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Fail fast with a clear message if the Actions secret is missing/empty.
      # lowlighter/metrics requires a classic PAT (ghp_...), not fine-grained (github_pat_...).
      - name: Verify METRICS_TOKEN secret
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "${METRICS_TOKEN}" ]; then
            echo "::error::Secret METRICS_TOKEN is missing or empty."
            echo "Add it at: Settings → Secrets and variables → Actions"
            echo "Name must be exactly: METRICS_TOKEN"
            echo "Value must be a classic PAT (starts with ghp_), not fine-grained (github_pat_)."
            exit 1
          fi
          case "${METRICS_TOKEN}" in
            ghp_*) echo "METRICS_TOKEN looks like a classic PAT." ;;
            github_pat_*)
              echo "::error::METRICS_TOKEN is fine-grained. Metrics needs a classic PAT (ghp_)."
              exit 1
              ;;
            *)
              echo "::warning::METRICS_TOKEN does not start with ghp_. If this fails, recreate a classic PAT."
              ;;
          esac

      # lowlighter/metrics commits the SVG itself when output_action is commit (default).
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          output_action: commit
          committer_message: "chore: update github-metrics.svg"

          # Lean base (header only). Plugins below match the requested set.
          base: header
          base_indepth: no

          # Pinned / featured repositories
          plugin_repositories: yes
          plugin_repositories_pinned: 4

          # Achievements (compact, avoid noise)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 6

          # Recently starred repositories
          plugin_stars: yes
          plugin_stars_limit: 4

          # Language mix
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%

          # Coding habits (facts only — charts add a lot of height)
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          config_timezone: Europe/Kyiv

          # Multi-year commit calendar
          plugin_calendar: yes
          plugin_calendar_limit: 3
