# Generates a contribution-grid snake animation via Platane/snk (dark palette).
# README uses: ./assets/github-contribution-grid-snake-dark.svg
name: Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # svg-only is faster than the full gif+svg action; dark palette for profile use.
      - name: Generate snake SVG (github-dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and push snake asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake-dark.svg
          if git diff --staged --quiet; then
            echo "No snake changes to commit."
            exit 0
          fi
          git commit -m "chore: update contribution snake animation"
          git push
